<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <defs>
    <linearGradient id="hal-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E28" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="hal-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="hal-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left: Icon Mark (Sprocket & Geometric H) -->
  <g transform="translate(4, 4) scale(0.6)">
    <!-- 12 Sprocket teeth -->
    <path d="
      M 56 6 L 64 6 L 65 14 L 55 14 Z
      M 80 12 L 87 18 L 82 25 L 75 20 Z
      M 98 32 L 102 40 L 93 44 L 90 36 Z
      M 106 56 L 106 64 L 98 65 L 98 55 Z
      M 102 80 L 98 88 L 90 82 L 93 75 Z
      M 87 102 L 80 108 L 75 100 L 82 95 Z
      M 64 114 L 56 114 L 55 106 L 65 106 Z
      M 40 108 L 33 102 L 38 95 L 45 100 Z
      M 22 88 L 18 80 L 27 75 L 30 82 Z
      M 14 64 L 14 56 L 22 55 L 22 65 Z
      M 18 40 L 22 32 L 30 36 L 27 44 Z
      M 33 18 L 40 12 L 45 20 L 38 25 Z
    " fill="url(#hal-red-grad)" />
    
    <!-- Outer rim circle -->
    <circle cx="60" cy="60" r="48" fill="url(#hal-dark-grad)" stroke="url(#hal-red-grad)" stroke-width="3" />
    <circle cx="60" cy="60" r="43" fill="#0B1120" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />
    
    <!-- Weight reduction holes -->
    <circle cx="60" cy="24" r="3" fill="#E50914" opacity="0.8" />
    <circle cx="60" cy="96" r="3" fill="#E50914" opacity="0.8" />
    <circle cx="24" cy="60" r="3" fill="#E50914" opacity="0.8" />
    <circle cx="96" cy="60" r="3" fill="#E50914" opacity="0.8" />

    <!-- Center Monogram 'H' -->
    <path d="M 37 32 L 47 32 L 47 88 L 37 88 Z" fill="#FFFFFF" />
    <path d="M 73 32 L 83 32 L 83 88 L 73 88 Z" fill="url(#hal-red-grad)" />
    <path d="M 47 54 L 73 54 L 73 66 L 47 66 Z" fill="url(#hal-red-grad)" />
    <path d="M 47 54 L 60 54 L 60 66 L 47 66 Z" fill="#FFFFFF" />
    <circle cx="60" cy="60" r="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="60" cy="60" r="2.2" fill="#E50914" />
  </g>

  <!-- Right: Real, editable typography for Light Background -->
  <text x="88" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="31" font-weight="900" letter-spacing="1" fill="#0F172A">
    HAMZA <tspan fill="#E50914">AUTOS</tspan>
  </text>
  
  <text x="89" y="64" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2.8" fill="#64748B">
    MOTORCYCLE REPAIR <tspan fill="#E50914">·</tspan> BADAMI BAGH
  </text>
</svg>

